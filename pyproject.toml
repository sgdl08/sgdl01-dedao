[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dedao-notebook"
version = "0.1.0"
description = "下载得到APP课程并上传到 Google NotebookLM"
requires-python = ">=3.10"
dependencies = [
    "notebooklm-py>=0.3.0",
    "click>=8.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
dedao-notebook = "dedao_notebook.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["dedao_notebook"]
